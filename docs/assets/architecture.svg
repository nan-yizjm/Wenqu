<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Wenqu：从资料到可核对的知识成果</title>
  <desc id="desc">React 前端经本机 FastAPI 调用资料导入、BM25 或 E5 混合检索、证据预算、Ollama 或 DeepSeek 生成。SQLite 保存会话、来源和收藏；文件保存快照、索引及导出。DeepSeek 位于远端边界。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#497466"/></marker>
    <style>
      text{font-family:Segoe UI,Microsoft YaHei,Arial,sans-serif;fill:#203b33} .title{font-size:32px;font-weight:700} .sub{font-size:17px;fill:#60756c}
      .label{font-size:20px;font-weight:600} .body{font-size:16px;fill:#496359} .small{font-size:14px;fill:#60756c}
      .card{fill:#fff;stroke:#d4dfd7;stroke-width:2;rx:16} .flow{fill:none;stroke:#497466;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="800" fill="#f5f7f2"/>
  <text x="48" y="60" class="title">Wenqu · 有来源的本地知识工作台</text>
  <text x="48" y="93" class="sub">资料接入 → 检索证据 → 生成与核对 → 保存成果</text>
  <rect x="32" y="125" width="960" height="600" rx="24" fill="#edf3ec" stroke="#9fb8a9" stroke-dasharray="8 6"/>
  <text x="56" y="160" class="small">本机边界 · Windows / 127.0.0.1</text>
  <rect x="64" y="184" width="880" height="76" class="card"/>
  <text x="88" y="217" class="label">React + TypeScript + Vite</text>
  <text x="88" y="244" class="body">资料库　·　流式问答　·　来源阅读　·　Studio　·　收藏与导出　·　设置</text>
  <path d="M504 260V293" class="flow"/>
  <rect x="64" y="296" width="880" height="64" class="card"/>
  <text x="88" y="324" class="label">FastAPI /api/v1</text>
  <text x="88" y="349" class="body">同源校验　·　输入验证　·　任务与流式事件　·　备份恢复　·　诊断与生命周期</text>
  <path d="M192 360V393" class="flow"/><path d="M512 360V393" class="flow"/><path d="M812 360V393" class="flow"/>
  <rect x="64" y="396" width="256" height="142" class="card"/>
  <text x="84" y="427" class="label">资料与版本</text>
  <text x="84" y="458" class="body">Markdown / PDF / Notebook</text>
  <text x="84" y="486" class="body">只读文件夹 · 上传副本</text>
  <text x="84" y="514" class="body">文本提取 · 分块 · 不变快照</text>
  <rect x="364" y="396" width="280" height="142" class="card"/>
  <text x="384" y="427" class="label">检索与证据预算</text>
  <text x="384" y="458" class="body">BM25 默认 / E5 + RRF 可选</text>
  <text x="384" y="486" class="body">查询守卫 · 相关度 · 上下文预算</text>
  <text x="384" y="514" class="body">来源标签 · 行号/页码 · 索引版本</text>
  <rect x="688" y="396" width="256" height="142" class="card"/>
  <text x="708" y="427" class="label">生成与知识整理</text>
  <text x="708" y="458" class="body">Ollama 本地生成 · 停止/重试</text>
  <text x="708" y="486" class="body">指南 · 确定性思维导图</text>
  <text x="708" y="514" class="body">Markdown / HTML / PNG</text>
  <path d="M320 468H359" class="flow"/><path d="M644 468H683" class="flow"/>
  <path d="M192 538V575" class="flow"/><path d="M504 538V557H732V575" class="flow"/><path d="M816 538V575" class="flow"/>
  <rect x="64" y="578" width="424" height="108" class="card"/>
  <text x="84" y="611" class="label">SQLite · 产品状态</text>
  <text x="84" y="641" class="body">资料版本 · 会话 · 来源 · 收藏 · Studio</text>
  <text x="84" y="666" class="small">迁移前备份 · 恢复后重启 · 历史引用可追溯</text>
  <rect x="520" y="578" width="424" height="108" class="card"/>
  <text x="540" y="611" class="label">本机文件与系统凭据</text>
  <text x="540" y="641" class="body">快照 · 提取文本 · 索引 · 模型缓存 · 导出</text>
  <text x="540" y="666" class="small">API Key 独立存储于 Windows 凭据管理器</text>
  <rect x="1024" y="296" width="224" height="242" rx="20" fill="#fbefe4" stroke="#d0ad87" stroke-width="2"/>
  <text x="1044" y="329" class="small">远端服务 · 用户主动选择</text>
  <text x="1044" y="371" class="label">DeepSeek API</text>
  <text x="1044" y="410" class="body">发送：问题、必要历史</text>
  <text x="1044" y="438" class="body">与检索到的证据片段</text>
  <text x="1044" y="492" class="small">联网与记忆接缝默认关闭</text>
  <text x="1044" y="516" class="small">没有云同步或后台遥测</text>
  <path d="M944 432H1019" class="flow"/>
  <text x="48" y="761" class="small">产品主线：src/product + web　|　RAG / Attention / SFT / QLoRA 学习实验保留独立复现入口</text>
</svg>
